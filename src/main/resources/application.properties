
spring.application.name=ScamShield

spring.datasource.url=jdbc:mysql://localhost:3306/scamshield_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=ScamShield-Dev-Secret-Key-2026-At-Least-32-Bytes
logging.level.org.springframework.security=TRACE

# Minimum number of different users required for public listing
scamshield.phone.minimum-reporters=2

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.web.resources.add-mappings=true